<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StageFlow — Administration</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="loginScreen" class="screen">
    <div class="login-card">
      <h1>Stage<span>Flow</span> Admin</h1>
      <p class="sub">Validation entreprises (NIF, NIS, NRC) et matricules étudiants</p>
      <label>Email administrateur</label>
      <input type="email" id="loginEmail" autocomplete="username" placeholder="admin@stageflow.dz">
      <label>Mot de passe</label>
      <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••">
      <button type="button" id="btnLogin" class="btn primary">Se connecter</button>
      <p id="loginError" class="error"></p>
    </div>
  </div>

  <div id="appScreen" class="screen hidden">
    <header class="topbar">
      <div class="brand">Stage<span>Flow</span> — Administration</div>
      <div class="topbar-right">
        <span id="adminName"></span>
        <button type="button" id="btnLogout" class="btn ghost">Déconnexion</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar">
        <button type="button" class="nav-item active" data-view="dashboard">Tableau de bord</button>
        <button type="button" class="nav-item" data-view="entreprises-pending">Entreprises en attente</button>
        <button type="button" class="nav-item" data-view="entreprises-all">Toutes les entreprises</button>
        <button type="button" class="nav-item" data-view="etudiants-pending">Étudiants en attente</button>
        <button type="button" class="nav-item" data-view="etudiants-all">Tous les étudiants</button>
        <button type="button" class="nav-item" data-view="audit">Journal d'audit</button>
      </nav>

      <main class="content">
        <div id="viewDashboard" class="view">
          <h2>Tableau de bord</h2>
          <div class="stats-grid" id="statsGrid"></div>
        </div>

        <div id="viewList" class="view hidden">
          <div class="list-header">
            <h2 id="listTitle"></h2>
            <input type="search" id="searchInput" placeholder="Rechercher…">
          </div>
          <div class="table-wrap">
            <table>
              <thead id="listHead"></thead>
              <tbody id="listBody"></tbody>
            </table>
          </div>
        </div>

        <div id="viewAudit" class="view hidden">
          <h2>Journal d'audit</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Date</th><th>Admin</th><th>Action</th><th>Entité</th><th>Détails</th></tr>
              </thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>
        </div>
      </main>

      <aside id="detailPanel" class="detail hidden">
        <button type="button" class="detail-close" id="closeDetail">✕</button>
        <div id="detailContent"></div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
