# Empêche la mise en pause automatique du projet Supabase (inactivité > 7 jours).
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health (connexion PostgreSQL)
        run: |
          echo "Keep-alive StageFlow API + Supabase PostgreSQL"
          curl -sf --max-time 60 "https://stage-flow-6rl5.onrender.com/api/health" | tee health.json
          grep -q '"connected":true' health.json && echo "OK — base connectée" || echo "ATTENTION — base hors ligne (reprendre Supabase)"
